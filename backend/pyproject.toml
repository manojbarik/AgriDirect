[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-farmer-buyer-marketplace-backend"
version = "0.1.0"
description = "FastAPI foundation for the AI Farmer-Buyer Marketplace"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "bcrypt>=4.0,<5.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pyjwt>=2.9,<3.0",
    "python-json-logger>=3.2,<4.0",
    "resend>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
